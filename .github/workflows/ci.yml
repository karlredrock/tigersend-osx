name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  suite:
    name: tests on Python ${{ matrix.python }}
    # pinned on purpose: ubuntu-latest moved to a release whose setup-python
    # no longer ships Python 3.9, and 3.9 is a target for this app
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python 2.3 compatibility check
        run: python tests/check_legacy_syntax.py tigersend.py tests/test_tigersend.py tests/fake_tk.py
      - name: test suite
        run: LC_ALL=C.UTF-8 python tests/test_tigersend.py
      - name: built-in self test
        run: python tigersend.py --self-test

  bundle:
    name: build the .app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build and verify the bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh --check
      - name: keep the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: TigerSend-app
          path: |
            TigerSend-*.zip
            SHA256SUMS.txt
          if-no-files-found: warn
