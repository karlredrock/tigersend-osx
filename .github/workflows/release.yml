name: release

# Builds TigerSend.app from the source at a tag and publishes it on the
# GitHub Release: TigerSend-<version>.zip + SHA256SUMS.txt.
#
# Three ways to run it:
#   - push a tag:            git push origin v1.9
#   - a release is created:  fires automatically
#   - by hand / by a tool:   gh api -X POST repos/OWNER/REPO/dispatches \
#                              -f event_type=publish-release \
#                              -f client_payload[tag]=v1.8
#
# If the release does not exist yet it is created from RELEASE_NOTES.md, so a
# tag push is enough to publish a complete release.

on:
  release:
    types: [created]
  push:
    tags: ['v*']
  repository_dispatch:
    types: [publish-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the bundle to'
        required: true
        default: 'v1.8'

permissions:
  contents: write

jobs:
  assets:
    name: build and publish TigerSend.app
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the bundle and run its self test
        run: |
          echo "tag: $TAG"
          chmod +x build_app.sh
          ./build_app.sh --check

      - name: Check the ZIP really is a working bundle
        run: |
          set -e
          ZIP="$(ls TigerSend-*.zip | head -1)"
          echo "zip: $ZIP"
          unzip -l "$ZIP"
          # the launcher must keep its executable bit in the archive
          unzip -Z "$ZIP" | grep 'Contents/MacOS/launcher' | grep -q '^-rwx' \
            || { echo "launcher lost its executable bit"; exit 1; }
          # no compiled code anywhere: that is what keeps one download valid
          # on PowerPC and on Intel
          if unzip -Z1 "$ZIP" | grep -Eq '\.(so|dylib|pyc|pyo)$'; then
            echo "compiled file in the bundle"; exit 1
          fi
          unzip -p "$ZIP" 'TigerSend.app/Contents/Info.plist' | grep -q '10.4' \
            || { echo "LSMinimumSystemVersion missing"; exit 1; }
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release if this tag has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            echo "creating release $TAG from RELEASE_NOTES.md"
            gh release create "$TAG" --title "TigerSend ${TAG#v}" \
              --notes-file RELEASE_NOTES.md --verify-tag
          fi

      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" TigerSend-*.zip SHA256SUMS.txt --clobber
